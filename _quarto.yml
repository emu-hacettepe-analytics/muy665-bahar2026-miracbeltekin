project:
  type: website
  output-dir: docs

website:
  title: "Miraç Beltekin"
  navbar:
    title: false
    search: true
    left:
      - text: "Miraç Beltekin"
        href: index.qmd
    right:
      - text: Anasayfa
        href: index.qmd
      - text: Hakkımda
        href: about.qmd
      - text: Portfolyo
        href: portfolyo.qmd
      - text: Proje
        href: proje.qmd
    tools:
      - icon: github
        href: https://github.com/miracbeltekin
      - icon: linkedin
        href: https://www.linkedin.com/in/miracbeltekin
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    center: "Hacettepe IE - MUY665 - Bahar 2026"
    border: true

format:
  html:
    toc: false
    anchor-sections: false
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    css: styles.css
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
          /* Navbar search ve theme toggle ikonlarını her ne olursa olsun göster */
          .navbar .quarto-search .aa-DetachedSearchButtonIcon::before,
          .navbar .quarto-search-button::before {
            content: "\F52A" !important;
            font-family: "bootstrap-icons" !important;
            font-size: 1rem;
            color: inherit;
            display: inline-block;
            line-height: 1;
          }
          .navbar .quarto-color-scheme-toggle::before,
          .navbar a.quarto-color-scheme-toggle::before {
            content: "\F49A" !important;
            font-family: "bootstrap-icons" !important;
            font-size: 1rem;
            color: inherit;
            display: inline-block;
            line-height: 1;
          }
          [data-bs-theme="dark"] .navbar .quarto-color-scheme-toggle::before {
            content: "\F5BE" !important;
          }
        </style>
    grid:
      sidebar-width: 0px
      body-width: 1100px
      margin-width: 0px
      gutter-width: 1.5rem

editor: visual
